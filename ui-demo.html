<script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app'), modal=$('#modal');
const packs=['Recruit','Outlaw','Devotion','Occult','Mythic'];

const heroes=[
['Knight','Common','#b9c6d0','Sword Strike','Shield Bash',19,3.2,.75,1.78],['Archer','Uncommon','#8acaab','Straight Arrow','Arrow Volley',12,3.6,.7,1.85],['Mage','Legendary','#ffc770','Explosive Fireball','Chain Bolt',14,4.8,.55,1.8],['Hunter','Unassigned','#a1c391','Serrated Arrow','Tripwire Trap',15,5.6,.55,1.87],['Barbarian','Unassigned','#df9878','Wide Cleave','Battle Frenzy',28,6.4,.5,1.78],['Rogue','Unassigned','#b3a0d8','Alternating Daggers','Smoke Bomb',14,1.6,2.1,1.95],['Paladin','Unassigned','#eac978','Hammer Strike','Divine Aegis',36,5.2,.65,1.72],['Nun','Unassigned','#d8cae5','Monastic Combination','Sanctuary Prayer',21,3.8,.9,1.85],['Priest','Epic','#ce91ff','Censuring Ray','Blessing of Courage',20,5.6,.6,1.76],['Shaman','Unassigned','#78d6c5','Vial Throw','Spirit Totem',20,6,.6,1.8],['Druid','Unassigned','#9cce79','Vine Wave','Bear Form',26,5.8,.65,1.78],['Warlock','Unassigned','#b06acc','Doom Sigil','Life Siphon',19,7.6,.5,1.75],['Beastmaster','Unassigned','#dcab7f','Whip','Summon Hound',31,6.6,.6,1.86],['Necromancer','Unassigned','#9da2e8','Soul Sucking Beam','Raise the Fallen',23,8.4,.5,1.73],['Dragonkin','Unassigned','#f49b69','Lunge','Dragon Breath',56,10,.4,1.7]];
const coords=[[17,75],[29,46],[42,66],[54,34],[66,55],[81,22],[87,64],[71,81],[46,21],[15,18]];
const DEMO={rescueSeconds:5,firstTaps:5,secondTaps:10,lootCost:1,rarities:['Uncommon','Rare','Epic','Legendary'],weights:[25,12,5,2],baseWeight:60};let units=[],focused=null,showcaseTimer=null,particles=[],dealClock=0;let s,screen='menu',timer=null,paused=false,elapsed=0,speed=1,aim=[400,145],spell=false,sound=false,session=false,zoom=1,pan=[0,0],drag=null,stagePreview=1;
function reset(preset=1){s={stage:preset,cap:preset===1?2:8,coins:0,up:preset===1?0:10,legacy:preset>=5?4:0,tier:preset===10?5:preset>=5?3:preset>=3?2:1,prestiges:preset===10?4:preset>=5?2:0,discovered:new Set(preset===1?[]:[0,1,2,3,8]),bought:new Set(),skinUnlocks:new Set(preset>=5?['0:Rare','1:Uncommon','2:Epic']:[]),discoveries:new Set(preset===1?[]:[0,1,2,3,8].map(i=>i+':Base')),stock:[],sealed:[],revealed:[],rerolls:preset>=3?1:0};restock();session=true}
function restock(){s.coins=s.cap;s.sealed=[];s.revealed=[];s.stock=[0,1,2].map((_,i)=>({pack:i===0?0:Math.min(s.tier-1,i),sold:false,hero:null}));s.stock.forEach(o=>o.price=o.pack+2);s.rerolls=s.tier>1?1:0}
reset();session=false;
function b(label,action,cls='',disabled=false){return '<button class="'+cls+'" data-act="'+action+'" '+(disabled?'disabled':'')+'>'+label+'</button>'}
function heading(title,extra=''){return '<header class="head">'+b('‹ Map','map')+'<h2>'+title+'</h2>'+extra+'</header>'}
function show(name){clearInterval(timer);clearTimeout(showcaseTimer);showcaseTimer=null;timer=null;paused=false;modal.innerHTML='';screen=name;render()}
function dialog(title,body,buttons){modal.innerHTML='<div class="veil"><section class="dialog" role="dialog" aria-modal="true"><h2>'+title+'</h2>'+body+'<div class="row">'+buttons+'</div></section></div>';paintCards()}
function close(){modal.innerHTML=''}
function canvas(w,h,attrs=''){return '<canvas width="'+w+'" height="'+h+'" '+(attrs.includes('class=')?attrs:'class="art" '+attrs)+'></canvas>'}
function card(i,known=true){const h=heroes[i];return '<button class="heroCard" style="--rar:'+(known?palette[h[1]]:'#55555f')+'" data-act="'+(known?'profile:'+i:'unknown')+'">'+canvas(40,48,'data-hero="'+i+'" data-known="'+known+'"')+'<b>'+ (known?h[0]:'Undiscovered')+'</b><small>'+(known?h[0]+' class':'?')+'</small><small>'+(known?h[1]:'?')+'</small></button>'}
function render(){let h='';if(screen==='menu'){h='<div class="body">'+canvas(320,180,'id="titleArt" class="art fullart"')+'<div class="menu"><small class="gold">A KINGDOM UNDER SIEGE</small><h1>FANTASY<br>WARRIORS</h1><div class="stack">'+b('Continue','continue','primary',!session)+b('New Game','new')+b('Settings','settings')+'</div></div><span class="tag">UI PROTOTYPE 0.2 · PLACEHOLDER ART</span></div>'}
else if(screen==='map'){h='<header class="head">'+b('‹ Menu','menu')+'<h2>The Realm</h2><span class="gold">✦ '+s.up+' UP</span><span>◈ '+s.legacy+'</span></header><div class="body map">'+canvas(320,180,'id="mapArt" class="art fullart"')+coords.slice(0,s.stage).map((p,i)=>'<button class="region '+(i===s.stage-1?'current':'done')+'" style="left:'+p[0]+'%;top:'+p[1]+'%" data-act="region:'+i+'"><span class="mark">'+icons[i]+'</span><b>'+stages[i]+'</b><small>'+(i===s.stage-1?'CURRENT':'CLEARED')+'</small></button>').join('')+'</div><footer class="foot"><div class="row">'+b('Skill Tree','tree')+b('Legacy','legacy')+b('Collection','collection')+'</div><div class="row">'+b('Settings','settings')+b('Prepare ›','shop','primary')+'</div></footer>'}
else if(screen==='shop'){h=heading('The Merchant','<span class="gold">◈ '+s.coins+' / '+s.cap+'</span>')+'<div class="body shop"><div class="merchant">'+canvas(96,116,'id="merchantArt"')+'<p>“Stock is limited, traveller. Choose wisely.”</p></div><section class="stall"><div class="row"><b>'+stages[s.stage-1]+'</b><span class="muted">· 3 offers</span></div><div class="offers">'+s.stock.map((o,i)=>'<div class="offer '+(o.sold?'sold':'')+'"><div class="pack">'+['✦','➶','✚','☾','♛'][o.pack]+'</div><b>'+packs[o.pack]+' Pack</b><small>1 temporary hero</small>'+b(o.sold?'SOLD':'◈ '+o.price,'buy:'+i,'',o.sold||s.coins<o.price)+'</div>').join('')+'</div><div class="row"><b>Sealed packs: '+s.sealed.length+'</b>'+b('↻ Reroll '+s.rerolls,'reroll','',!s.rerolls||s.stock.every(o=>o.sold))+'</div></section></div><footer class="foot"><small>Mock stock · purchased slots stay sold</small>'+b('Enter Battle ›','enter','primary',!s.sealed.length)+'</footer>'}
else if(screen==='loot'){h=heading('Skin Loot Boxes','<span class="gold">◈ '+s.legacy+'</span>')+'<div class="body loot"><div class="stack" style="align-items:center"><div class="lootChest">✦</div><h3>Legacy cache</h3>'+b('Open sample box · ◈ '+DEMO.lootCost,'lootbuy','primary',s.legacy<DEMO.lootCost)+'</div><div class="panel stack"><h3>Unlock appearances</h3><p>Spend earned prestige shards on skin unlocks, separate from ordinary hero rarity.</p><div class="skinList">'+DEMO.rarities.map(r=>'<span style="color:'+palette[r]+'">'+r+'</span>').join('')+'</div><small>Demo only: sample price, reward and odds. Final loot rules and HP / damage bonuses TBD.</small><b>'+s.skinUnlocks.size+' sample skins unlocked</b></div></div><footer class="foot"><small>Earned currency only · no real-money purchases</small>'+b('‹ Legacy','legacy')+'</footer>'}
else if(screen==='collection'){h=heading('Hero Collection','<span>'+s.discovered.size+' / 15</span>')+'<div class="body collection">'+packs.map((p,i)=>'<section class="pool"><h3>'+p+'</h3><div class="cards">'+[0,1,2].map(j=>card(i*3+j,s.discovered.has(i*3+j))).join('')+'</div></section>').join('')+'</div>'}
else if(screen==='tree'||screen==='legacy'){h=heading(screen==='tree'?'Skill Tree':'Permanent Legacy','<span class="gold">'+(screen==='tree'?s.up+' UP':s.legacy+' ◈')+'</span>')+'<div class="body tree" id="treeArea"><div class="treeworld" id="treeWorld"></div><div class="treeTools">'+b('−','zoomout')+b('+','zoomin')+b('Fit','fit')+'</div></div><footer class="foot"><small>Drag to pan · + / − to zoom · select a node</small>'+ (screen==='tree'?b('Legacy ›','legacy'):'<div class="row">'+b('Skin Loot Boxes','loot')+b('Prestige ritual','prestige','primary',s.stage<5)+'</div>')+'</footer>'}

case'reroll':if(s.rerolls){s.rerolls--;s.stock.forEach((o,j)=>{if(!o.sold){o.pack=j===0?0:Math.floor(Math.random()*s.tier);o.price=o.pack+2}});render()}break;case'enter':if(s.sealed.length)show('battle');break;case'showcaseDone':finishShowcase();break;case'rescue':rescue(focused);break;case'lootbuy':lootBuy();break;
case'profile':profile(i);break;case'unknown':break;
case'zoomout':zoom=Math.max(.35,zoom-.15);transformTree();break;case'zoomin':zoom=Math.min(2,zoom+.15);transformTree();break;case'fit':drawTree(true);break;case'node':{let n=nodes.find(x=>x.id===v);if(!n)break;let bought=n.free||s.bought.has(v)||(n.gate&&s.discovered.has(n.hero)&&s.stage>1),pre=nodes.find(x=>x.id===n.pre),ok=!pre||pre.free||s.bought.has(pre.id)||(pre.gate&&s.discovered.has(pre.hero)&&s.stage>1),bank=screen==='legacy'?s.legacy:s.up;dialog(n.name,'<p>Sample effect: '+(n.type==='ability'?'Enhance class special':n.type==='legacy'?'Permanent progression bonus':n.gate?'Class-kill prerequisite':'Increase hero effectiveness')+'</p><p>Cost: '+n.cost+' · Prerequisite: '+(pre?pre.name:'None')+'</p><small>'+(bought?'Purchased':n.gate?'Class quest required':ok?'Available':'Prerequisite locked')+'</small>',b('Purchase','purchase:'+v,'primary',bought||n.gate||!ok||bank<n.cost)+b('Close','close'));break}
case'purchase':{let n=nodes.find(x=>x.id===v),pre=nodes.find(x=>x.id===n?.pre),ok=!pre||pre.free||s.bought.has(pre.id)||(pre.gate&&s.discovered.has(pre.hero)&&s.stage>1);if(n&&!n.gate&&!n.free&&ok&&!s.bought.has(v)){let bank=screen==='legacy'?'legacy':'up';if(s[bank]>=n.cost){s[bank]-=n.cost;s.bought.add(v)}}close();render();break}
case'prestige':if(s.stage>=5)dialog('Prestige ritual','<p>Reset mock campaign, ordinary upgrades and class progress. Retain Legacy perks and gain sample shards.</p>',b('Begin ritual','ritual','primary')+b('Cancel','close'));break;case'ritual':{let retained=[...s.bought].filter(x=>x.startsWith('l')),legacy=s.legacy+2,prestiges=s.prestiges+1,skins=new Set(s.skinUnlocks),discoveries=new Set(s.discoveries),known=new Set(s.discovered);dialog('The ritual begins','<div class="ritual">✦</div><p>Legacy endures.</p>','');setTimeout(()=>{reset();s.legacy=legacy;s.prestiges=prestiges;s.skinUnlocks=skins;s.discoveries=discoveries;s.discovered=known;retained.forEach(x=>s.bought.add(x));show('map')},2200);break}
case'speed':speed=speed===1?2:speed===2?4:1;document.querySelector('[data-act="speed"]').textContent=speed+'×';break;case'spell':spell=!spell;document.querySelector('[data-act="spell"]').textContent=spell?'Cancel spell':'✦ Spell';break;case'pause':paused=true;dialog('Paused','<p>Battle simulation is paused.</p>',b('Resume','resume','primary')+b('Restart attempt','restart','danger')+b('Preview victory','win')+b('Preview defeat','lose'));break;case'resume':paused=false;close();break;case'restart':dialog('Restart attempt?','<p>Discard this mock attempt and return to preparation.</p>',b('Restart','retry','danger')+b('Cancel','pause'));break;case'retry':restock();show('shop');break;case'win':outcome(true);break;case'lose':outcome(false);break;case'result':if(i&&s.stage<10)s.stage++;restock();show(i?'map':'shop');break}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(sound){try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=320;g.gain.value=.035;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.035);o.onended=()=>ctx.close()}catch{}}act(el.dataset.act)});document.addEventListener('change',e=>{if(e.target.id==='sound')sound=e.target.checked});window.addEventListener('resize',()=>{if(screen==='tree'||screen==='legacy')drawTree(true)});render();
</script></body></html>
