name: Balance lab smoke tests
on:
  push:
    branches: [balance-v1.16]
    paths:
      - 'tools/balance/**'
      - 'merchant.js'
      - 'battle-actions.js'
      - 'prestige-enemies.js'
      - 'tower-fire.js'
      - 'game-*.js'
      - 'skill-tree.js'
      - 'index.html'
      - 'balance-lab.html'
      - '.github/workflows/balance-lab-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/balance/**'
      - 'merchant.js'
      - 'battle-actions.js'
      - 'prestige-enemies.js'
      - 'tower-fire.js'
      - 'game-*.js'
      - 'skill-tree.js'
      - 'index.html'
      - 'balance-lab.html'
      - '.github/workflows/balance-lab-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [live, candidate]
    defaults:
      run:
        working-directory: tools/balance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node merchant.test.mjs
      - run: node battle-actions.test.mjs
      - run: node prestige-enemies.test.mjs
      - run: node merchant-integration.test.mjs
      - run: node run.mjs --profile=${{ matrix.profile }} --stages=1,2,10 --seeds=2 --max-seconds=240 --output=smoke-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: balance-smoke-${{ matrix.profile }}
          path: tools/balance/smoke-${{ matrix.profile }}.json
